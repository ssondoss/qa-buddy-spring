spring.application.name=qa-buddy

# Database (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/qabuddy}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:pos}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.flyway.enabled=true

app.security.jwt.secret=${JWT_SECRET:change-me-to-a-strong-secret}
app.security.jwt.issuer=${JWT_ISSUER:qa-buddy}
app.security.jwt.ttl=${JWT_TTL:PT24H}

# Mail (Brevo SMTP)
spring.mail.host=${SMTP_HOST:smtp-relay.brevo.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:}

