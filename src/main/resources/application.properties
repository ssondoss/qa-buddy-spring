spring.application.name=qa-buddy

# Database (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/qabuddy}
spring.datasource.username=${DB_USERNAME:qabuddy}
spring.datasource.password=${DB_PASSWORD:qabuddy}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# JWT (HMAC). Use a strong secret (>= 32 chars) in real environments.
app.security.jwt.secret=${JWT_SECRET:change-me-change-me-change-me-change-me}
app.security.jwt.issuer=${JWT_ISSUER:qa-buddy}
app.security.jwt.ttl=${JWT_TTL:PT24H}
