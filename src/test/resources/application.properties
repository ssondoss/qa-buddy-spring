spring.datasource.url=jdbc:h2:mem:qa-buddy-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false

app.security.jwt.secret=test-secret-test-secret-test-secret-1234
app.security.jwt.issuer=qa-buddy-test
app.security.jwt.ttl=PT1H
app.mail.enabled=false
app.mail.verification-base-url=http://localhost:8080
app.mail.verification-ttl=PT24H
app.mail.resend-cooldown=PT1M
app.mail.max-resend-attempts-per-day=5
app.frontend.login-url=http://localhost:4200/login
